name: Kurate discovery boundary

on:
  pull_request:
    paths:
      - 'internal/research_kernel_mcp/**'
      - 'tests/internal/test_research_kernel_mcp.py'
      - 'tests/internal/test_kurate_discovery.py'
      - 'docs/kurate-discovery.md'
      - '.github/workflows/kurate-discovery.yml'
  push:
    branches: ['main']
    paths:
      - 'internal/research_kernel_mcp/**'
      - 'tests/internal/test_research_kernel_mcp.py'
      - 'tests/internal/test_kurate_discovery.py'
      - '.github/workflows/kurate-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Run Research Kernel and Kurate boundary tests
        run: pytest -q tests/internal/test_research_kernel_mcp.py tests/internal/test_kurate_discovery.py

      - name: Run deterministic server self-test
        run: python internal/research_kernel_mcp/kurate_server.py --self-test
