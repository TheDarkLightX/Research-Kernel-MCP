name: Kurate discovery-signal integration

on:
  pull_request:
    paths:
      - 'internal/research_kernel_mcp/kernel.py'
      - 'internal/research_kernel_mcp/server.py'
      - 'internal/research_kernel_mcp/kurate.py'
      - 'internal/research_kernel_mcp/kurate_server.py'
      - 'tests/internal/test_research_kernel_mcp.py'
      - 'tests/internal/test_kurate_adapter.py'
      - 'docs/kurate-integration.md'
      - 'examples/kurate-assessment.example.json'
      - '.github/workflows/kurate-discovery-signals.yml'
  push:
    branches: ['main']
    paths:
      - 'internal/research_kernel_mcp/kernel.py'
      - 'internal/research_kernel_mcp/server.py'
      - 'internal/research_kernel_mcp/kurate.py'
      - 'internal/research_kernel_mcp/kurate_server.py'
      - 'tests/internal/test_research_kernel_mcp.py'
      - 'tests/internal/test_kurate_adapter.py'
      - 'docs/kurate-integration.md'
      - 'examples/kurate-assessment.example.json'
      - '.github/workflows/kurate-discovery-signals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run base and Kurate adapter tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/internal/test_research_kernel_mcp.py \
            tests/internal/test_kurate_adapter.py

      - name: Run extension self-test without MCP transport
        run: |
          set -euo pipefail
          python internal/research_kernel_mcp/kurate_server.py --self-test
