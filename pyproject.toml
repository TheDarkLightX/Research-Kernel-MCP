[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-kernel-mcp"
version = "0.1.0"
description = "Fail-closed, evidence-first research memory and verification server for the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.0,<3",
]
keywords = ["mcp", "research", "provenance", "verification", "ai-agents"]

[project.scripts]
research-kernel-mcp = "internal.research_kernel_mcp.server:main"

[project.urls]
Repository = "https://github.com/TheDarkLightX/Research-Kernel-MCP"
Issues = "https://github.com/TheDarkLightX/Research-Kernel-MCP/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["internal", "internal.*"]
